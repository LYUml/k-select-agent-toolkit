[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k-select-agent-toolkit"
version = "0.1.1"
description = "CLI-Anything style CLI and MCP adapter for Krueger K-Select GRD"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["click==8.5.1", "mcp==2.3.0", "pywinauto==0.6.9; sys_platform == 'win32'", "pypdf==7.1.0", "prompt-toolkit==3.0.53"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "build==1.6.1"]

[project.scripts]
k-select = "cli_anything.kselect.cli:main"
cli-anything-kselect = "cli_anything.kselect.cli:main"
k-select-mcp = "cli_anything.kselect.server:main"

[tool.setuptools.packages.find]
include = ["cli_anything*"]
namespaces = true

[tool.setuptools.package-data]
"cli_anything.kselect" = ["skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires installed GRD and an unlocked Windows desktop"]
